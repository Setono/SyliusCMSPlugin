        taken: 'The URL %url% is already the URL of "%title%" in %channels%.'
        taken_by_route: 'The URL %url% is taken by the route %route%.'
        taken_in_channel: 'The URL %url% is already the URL of "%title%" in %channels%, so this can''t be shown there too.'
