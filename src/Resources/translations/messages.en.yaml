        blog_post: Posts
        faq_category: Categories
        faq_item: Questions
        page: Pages
        snippet: Snippets
    # A collection is named by its content type's code here, in the hub and its list, or else by its plural or its label
    collection:
        blog_post: Blog
        faq_item: FAQ
    field:
        accordion_item:
            content: Content
            title: Title
        banner:
            alt: Alt text
            alt_help: Describes the image here. Leave it empty to use the image's own alt text from the media library.
            full_width: Full width
            heading: Heading
            image: Image
            mobile_image: Mobile image
            mobile_image_help: Shown instead of the image on narrow screens, such as phones. Leave it empty to show the image there too.
            priority: Load first
            priority_help: Loads the image before the rest of the page. Turn it on for a banner at the top of the page, and leave it off for banners further down.
            text: Text
        bestsellers_source:
            include_children: Include the taxons below it
            taxon: Taxon
        blog_category:
            description: Description
        blog_post:
            categories: Categories
            excerpt: Excerpt
            featured_image: Featured image
            published_at: Date
        button:
            link: Link
        carousel:
            autoplay: Autoplay
            interval: Interval
            interval_help: The seconds each slide shows while it autoplays, from 2 to 30.
            per_view: Slides per view
        channel_condition:
            channels: Channels
        customer_group_condition:
            groups: Customer groups
        date_window_condition:
            from: From
            until: Until
        downloads:
            documents: Documents
            heading: Heading
        entries:
            display: Display
            entries: Entries
            paginate: Split into pages
            paginate_help: Shows as many entries per page as the list shows, with numbered links to the other pages. It needs a source.
        entries_from_collection_source:
            categories: Categories
            categories_help: Leave it empty to list the whole collection.
            content_type: Collection
        entry_condition:
            entries: Entries
        entry_in_category_condition:
            categories: Categories
        embed_code:
            code: Code
            code_help: 'HTML, scripts included, such as a review widget or a newsletter form. It runs in the shop as it is, but not in the builder''s preview.'
        faq_item:
            answer: Answer
            categories: Categories
        group:
            full_width: Full width
        heading:
            level: Level
            text: Text
        image:
            alt: Alt text
            alt_help: Describes the image here. Leave it empty to use the image's own alt text from the media library.
            caption: Caption
            image: Image
            link: Link
        link:
            link: Link
        link_list:
            heading: Heading
        locale_condition:
            locales: Locales
        product_associations_source:
            association_type: Association type
            association_type_help: Leave it empty to list the products of every association type.
        product_attribute_binding:
            attribute: Attribute
        product_condition:
            products: Products
        product_in_taxon_condition:
            include_children: Include the taxons below them
            taxons: Taxons
        products:
            display: Display
            products: Products
        products_in_taxon_source:
            include_children: Include the taxons below it
            sort: Sort by
            taxon: Taxon
        rich_text:
            content: Content
        snippet:
            snippet: Snippet
        spacer:
            size: Size
        standard:
            show_title: Show title
        taxon_children_source:
            taxon: Taxon
        taxon_condition:
            taxons: Taxons
        taxons:
            taxons: Taxons
        video:
            embed_url: YouTube or Vimeo URL
            embed_url_help: Paste the address of a YouTube or Vimeo video, or choose a video from the media library instead.
            poster: Poster
            poster_help: Shown before the video plays. Leave it empty to use the video's own poster from the media library.
            video: Video
    # What an import plans and why it refuses, which setono:cms:import prints and the admin's Import shows. See "What an
    # import does", "Conflicts" and "Code the target must have" in docs/spec/transfer.md
    import:
        conflict:
            draft: '%title% has unpublished changes here.'
            scheduled_publish: '%title% has a scheduled publish here.'
            stale: '%title% changed here at %changed_at%, after the export''s copy from %exported_at%.'
            url_clash: '%title% would have the URL %url%, which %other% has in %channels%.'
        embed_code: 'Embed code is switched off in this shop, so %title% can''t bring in an Embed code block that isn''t published here with the same key and code.'
        # Why a media item's file in an export is refused, before the checks an upload goes through. See "Media files"
        # in docs/spec/transfer.md
        media_file:
            checksum: '%filename% doesn''t match its checksum, so it isn''t the file that was exported.'
            filename: '"%filename%" isn''t a plain filename.'
        media_refused: 'The media item %name% can''t be imported: %reason%'
        newer_version: '%title% can''t be imported: %reason%. Deploy the code first.'
        not_publishable: '%title% can''t be published: %reason%'
        other_content_type: '%title% has the UUID of an entry of the content type "%content_type%" here, so it can''t be imported.'
        path_outside_root: 'The export holds %path%, which isn''t inside its folder: it''s an absolute path, a path with "..", or a link.'
        settings_refused: 'The settings of %title% can''t be saved: %reason%'
        unknown_block_type: '%title% has blocks of the type "%type%", which the code here doesn''t have. Deploy the code first.'
        unknown_content_type: '%title% is of the content type "%content_type%", which the code here doesn''t have. Deploy the code first.'
        unknown_layout: '%title% has the layout "%layout%", which the code here doesn''t have for its content type. Deploy the code first.'
    layout:
        blog_category:
            standard: Standard
        blog_post:
            article: Article
        page:
            standard: Standard
    # The link targets' labels. See "Link targets" in docs/spec/extending.md
    link_target:
        entry: Entry
        media: Document or video
        product: Product
        taxon: Taxon
        url: URL
    menu:
        admin:
            hub:
                all_entries: All entries
                entries: Entries
                library: Library
                media: Media
                overview: Overview
                pages: Pages
                presets: Presets
                snippets: Snippets
                transfer: Transfer
            main:
                content:
                    content: Content
                    header: Content
    form:
        entry:
            blank: Blank
            channels: Channels
            layout: Layout
            slug: Slug
            slug_help: 'Generated from the title until you change it. It may have slashes, such as about/team.'
            slug_rules: A slug can't start or end with a slash, or have two slashes in a row.
            starting_point: Starting point
            starting_point_help: A starting point gives the new entry its blocks and its layout.
            title: Title
    media:
        # Why a media item can't be deleted. See "Deleting" in docs/spec/media.md
        in_use: '{1} It''s used in one place, so it can''t be deleted.|]1,Inf[ It''s used in %count% places, so it can''t be deleted.'
        # Why the media library refused a file. See "Uploading" in docs/spec/media.md
        refused:
            not_allowed: '%filename% is a %type% file, which the media library doesn''t take. It takes %types%, up to %limit% each.'
            # A file that would replace the file of a media item of another kind
            not_document: '%filename% isn''t a document. Only a document can replace a document.'
            not_image: '%filename% isn''t an image. Only an image can replace an image.'
            not_uploaded: '%filename% didn''t arrive in full. Try uploading it again.'
            not_video: '%filename% isn''t a video. Only a video can replace a video.'
            over_limit: '%filename% is over the upload limit of %limit%.'
            too_big: '%filename% is %size%, over the upload limit of %limit%.'
            unreadable: '%filename% couldn''t be read as a %type% file.'
    # The links to the pages of a paginated Entries block in the shop. See "The Entries block" in docs/spec/collections.md
    pagination:
        label: Pages
        next: Next
        previous: Previous
    # What the builder's preview shows editors and shoppers don't see
    preview:
        embed_code: 'Embed code runs in the shop, not in the builder''s preview.'
        unresolved_link: '%field% isn''t shown here: what it links to isn''t visible in this channel and locale, or was deleted.'
        unresolved_rich_text_link: 'A link in %field% shows as plain text here: what it links to isn''t visible in this channel and locale, or was deleted.'
    # What inserting a preset tells editors, and why saving one is refused. See "What inserting copies" and "Editor
    # presets" in docs/spec/layouts-and-presets.md
    preset:
        details_not_text: 'A preset''s name, category and description must be text.'
        disabled_block_type: '%block% blocks are switched off, so the preset''s were left out.'
        # Why the block picker's Presets tab leaves a preset out at a spot. See "Where a preset is offered"
        fit:
            needs_context: 'Needs: %context%'
            not_allowed: '%block% isn''t allowed here'
            nothing_to_insert: 'Nothing in it can be inserted'
            # A paginated Entries block in it would break a pagination rule here. See "Pagination" in docs/spec/collections.md
            paginate_twice: 'Splits a list into pages, which another list here already does'
            paginate_without_source: 'Splits a list into pages that no source fills'
            paginate_without_url: 'Splits a list into pages, which only an entry with its own URL can'
            too_many: 'At most %count% %block% blocks fit here'
            wrong_entry: 'Not for: %content_type%'
        # What setono:cms:preset:validate reports and the Presets tab marks a preset for. See "Presets with invalid blocks"
        issue:
            disabled_block_type: '%block% blocks are switched off, so inserting it leaves them out.'
            no_blocks: 'It holds no blocks, so it has nothing to insert.'
            not_allowed: '%block% isn''t allowed in %parent%.'
            removed_block_type: 'It has blocks of the type "%type%", which the code no longer has, so inserting it leaves them out.'
            too_few: '%parent% needs at least %count% %block% blocks.'
            too_many: '%parent% holds at most %count% %block% blocks.'
            unknown_content_type: 'Its starting point is for the content type "%content_type%", which the code doesn''t have.'
            unknown_layout: 'Its starting point''s layout "%layout%" isn''t a layout of %content_type%.'
        name_required: 'A preset needs a name.'
        # Why the builder's request to save or replace an editor preset was refused, which it shows the editor
        request:
            block_preset_by_tree: 'A block preset is replaced by blocks, not by a whole tree.'
            blocks: 'The request needs the keys of the blocks to save, or the whole tree.'
            entry: 'The request needs the entry the blocks are in.'
            no_block_tree: 'The content type "%content_type%" has no block tree, so it has no starting points.'
            no_blocks: 'The entry has no blocks to save as a starting point.'
            select: 'Select one or more blocks to save as a preset.'
            starting_point_by_another_tree: 'A starting point is replaced by the whole tree of an entry of its content type, "%content_type%".'
            unknown_blocks: 'There is no block %keys% in the tree.'
        newer_version: '"%type%" in the preset was saved with version %version%, but this store has version %code_version%, so the preset can''t be inserted.'
        removed_block_type: 'Blocks of the type "%type%", which the code no longer has, were left out.'
        # The texts of the code presets the plugin ships in src/Resources/presets, by code: each one's name and
        # description, and the text in its blocks. See "Shipped code presets" in docs/spec/layouts-and-presets.md
        banner_carousel:
            description: 'Three banners in a carousel, each with a heading, text and a button'
            name: 'Banner carousel'
            slide_1:
                button: 'Shop new arrivals'
                heading: 'New arrivals'
                text: '<p>The latest additions to our range, just in.</p>'
            slide_2:
                button: 'See the bestsellers'
                heading: Bestsellers
                text: '<p>The products our customers love most.</p>'
            slide_3:
                button: 'Shop the sale'
                heading: Sale
                text: '<p>Great prices on selected products, while stocks last.</p>'
        bestsellers_carousel:
            description: 'The channel''s bestsellers in a carousel'
            name: 'Bestsellers carousel'
        blog_category_archive:
            description: 'The category''s posts, newest first, split into pages'
            name: 'Category archive'
        blog_page:
            description: 'The blog''s posts, newest first, split into pages under a heading. Create it at the slug blog'
            heading: 'Latest posts'
            name: 'Blog page'
        campaign_with_fallback:
            campaign:
                button: 'Shop the sale'
                heading: 'Our biggest sale of the year'
                text: '<p>Save on hundreds of products, for a limited time only.</p>'
            description: 'A campaign banner while its date window is open, and a default banner otherwise. Set the dates in the campaign banner''s conditions'
            fallback:
                button: 'Shop now'
                heading: 'Welcome to our store'
                text: '<p>Discover this season''s new arrivals and find something you''ll love.</p>'
            name: 'Campaign with fallback'
        content_page:
            description: 'A heading and text under the title, for pages such as About us or Delivery'
            heading: 'Our story'
            name: 'Content page'
            text: '<p>Tell your customers who you are, how you started and what you care about.</p><p>Add more headings and text to cover everything they need to know.</p>'
        faq:
            description: 'Three questions, each opening to its answer'
            name: FAQ
            question_1:
                answer: '<p>Most orders arrive within 2 to 5 working days.</p>'
                title: 'How long does delivery take?'
            question_2:
                answer: '<p>Yes. You can return unused items within 30 days for a full refund.</p>'
                title: 'Can I return my order?'
            question_3:
                answer: '<p>Email or call us, and we''ll get back to you within one working day.</p>'
                title: 'How can I contact you?'
        faq_page:
            description: 'The questions of the FAQ under a heading, each opening to its answer'
            heading: 'Frequently asked questions'
            name: 'FAQ page'
        footer_links:
            about:
                heading: 'About us'
                privacy: 'Privacy policy'
                story: 'Our story'
                terms: 'Terms and conditions'
            customer_service:
                contact: 'Contact us'
                delivery: Delivery
                heading: 'Customer service'
                returns: Returns
            description: 'Three lists of links side by side, such as for a footer snippet'
            name: 'Footer links'
            shop:
                bestsellers: Bestsellers
                heading: Shop
                new_arrivals: 'New arrivals'
                sale: Sale
        hero:
            description: 'A full-width banner with a heading, text and two buttons, for the top of a page'
            heading: 'Welcome to our store'
            name: Hero
            primary_button: 'Shop now'
            secondary_button: 'Learn more'
            text: '<p>Discover this season''s new arrivals and find something you''ll love.</p>'
        image_and_text:
            button: 'Read more'
            description: 'An image beside a heading, text and a button'
            heading: 'Made to last'
            name: 'Image and text'
            text: '<p>Tell your customers what makes your products special: how they''re made, what they''re made of and why they''re worth it.</p>'
        landing_page:
            description: 'A banner carousel, the bestsellers, three USPs and text, with the title hidden'
            name: 'Landing page'
            text: '<h2>Why shop with us</h2><p>Tell your customers who you are, what you sell and what makes your store worth coming back to.</p>'
        latest_posts:
            description: 'The three newest blog posts in a grid'
            name: 'Latest posts'
        related_posts:
            description: 'Three posts in the categories of the post on the page, in a grid. Offered on blog posts'
            name: 'Related posts'
        related_products:
            description: 'The products associated with the product on the page, of every association type. Offered where a product is available'
            name: 'Related products'
        three_usps:
            description: 'Three columns, each with an image, a heading and text, for what sets your store apart'
            name: 'Three USPs'
            usp_1:
                heading: 'Free delivery'
                text: '<p>On every order over a set amount, straight to your door.</p>'
            usp_2:
                heading: 'Easy returns'
                text: '<p>Changed your mind? Send it back within 30 days.</p>'
            usp_3:
                heading: 'Secure payment'
                text: '<p>Pay safely with the method you prefer.</p>'
    # The categories of the shipped code presets, which editors' presets can share
    preset_category:
        banners: Banners
        blog: Blog
        content: Content
        navigation: Navigation
        pages: Pages
        products: Products
    # What each kind of problem says. See "Problems" in docs/spec/admin.md
    problem:
        broken_entry_reference: '%field% refers to %type% that was deleted, so it isn''t shown.'
        broken_entry_rich_text_reference: 'A link in %field% leads to %type% that was deleted, so it shows as plain text.'
        broken_layout_reference: '%field% in the layout refers to %type% that was deleted, so it isn''t shown.'
        broken_layout_rich_text_reference: 'A link in %field% in the layout leads to %type% that was deleted, so it shows as plain text.'
        broken_reference: '%field% in the %block% block refers to %type% that was deleted, so it isn''t shown.'
        broken_rich_text_reference: 'A link in %field% in the %block% block leads to %type% that was deleted, so it shows as plain text.'
        capped_slot_without_catch_all: '"%slot%" is capped at %cap% and has no catch-all placement, with no page scope and a published, enabled snippet for everyone, so some pages or shoppers may see nothing there.'
        category_archive_without_entries: 'Its page lists none of the category''s entries, as no Entries block is left in its blocks. Add an Entries block filled by %source%.'
        deleted_customer_group: 'The customer group "%group%" in a condition of the %block% block was deleted, so the condition no longer matches anyone through it.'
        deleted_customer_group_negated: 'The customer group "%group%" in a condition of the %block% block was deleted, so the condition no longer excludes anyone through it.'
        deleted_customer_group_in_audience: 'The customer group "%group%" in the audience was deleted, so the audience no longer counts anyone through it.'
        misfit_entry_value: '%field% holds a value that doesn''t fit its field type, so it counts as empty.'
        misfit_layout_value: '%field% in the layout holds a value that doesn''t fit its field type, so it counts as empty.'
        misfit_value: '%field% in the %block% block holds a value that doesn''t fit its field type, so it counts as empty.'
        page_scope_removed_kind: 'The page scope of the placement in "%slot%" has a condition of the kind "%kind%", which the code no longer has, so the placement shows nothing.'
        page_scope_unprovided: 'The page scope of the placement in "%slot%" has a condition, %kind%, that needs the host-page context "%context%", which the slot no longer provides, so the placement shows nothing.'
        preset_removed_block_type: 'It has blocks of the type %types%, which the code no longer has, so inserting it leaves them out.'
        placement_hidden_by_homepage: 'The placement in "%slot%" doesn''t show in %channels%, whose homepage is a CMS page, as Sylius''s own homepage doesn''t render there.'
        removed_layout: 'Its layout "%layout%" was removed from the code or disabled, so it shows in the default layout, %default%, until you pick one.'
        removed_context_key: 'It needs the context key "%key%", which the code no longer has, so none of its placements shows it.'
        removed_slot: 'A placement in the slot "%slot%", which the code no longer has, shows nothing.'
        scheduled_publish_failed: 'The publish scheduled for %at% was stopped: %reason%'
        scheduled_publish_overdue: 'The publish scheduled for %at% hasn''t run. The Messenger worker may not be running.'
        snippet_inside_itself: 'The %block% block shows this snippet inside itself, directly or through other snippets, so it''s skipped there.'
        unknown_bindable_property: '%field% in the %block% block is bound to "%property%", which the code no longer has, so it shows its fallback.'
        unknown_block_type: 'A block of the type "%type%", which the code no longer has, isn''t shown.'
        unknown_layout_bindable_property: '%field% in the layout is bound to "%property%", which the code no longer has, so it shows its fallback.'
        unknown_entry_source: '%field% is filled by the source "%source%", which the code no longer has, so it lists nothing.'
        unknown_layout_source: '%field% in the layout is filled by the source "%source%", which the code no longer has, so it lists nothing.'
        unknown_source: '%field% in the %block% block is filled by the source "%source%", which the code no longer has, so it lists nothing.'
        unreadable: 'This content can''t be read: %reason%'
        url_taken_by_route: 'URL taken by a Sylius route: shoppers get the page of the route %route% at %url%.'
    # Each kind of problem, by its code, as the Overview's Needs attention groups them. A project names its own kinds here
    problem_kind:
        broken_reference: Broken references
        capped_slot_without_catch_all: Capped slots without a catch-all placement
        category_archive_without_entries: Category pages without an Entries block
        deleted_customer_group: Deleted customer groups
        misfit_value: Values that don't fit their field
        page_scope_mismatch: Page scopes that don't fit their slots
        placement_hidden_by_homepage: Placements a CMS homepage hides
        preset_removed_block_type: Presets with blocks of removed types
        removed_context_key: Removed context keys
        removed_layout: Removed layouts
        scheduled_publish_failed: Failed scheduled publishes
        scheduled_publish_overdue: Overdue scheduled publishes
        snippet_inside_itself: Snippets inside themselves
        unknown_bindable_property: Bindings of removed properties
        unknown_block_type: Blocks of removed types
        unknown_source: Lists filled by removed sources
        url_taken_by_route: URLs taken by Sylius routes
    publish:
        invalid: '{1} One error needs fixing|]1,Inf[ %count% errors need fixing'
    # What a reference refers to, by its type, with its article, as a broken reference names it. See "References" in docs/spec/content-model.md
    reference_type:
        entry: an entry
        media_item: a media item
        product: a product
        taxon: a taxon
    # Why a scheduled publish was stopped when it ran, which the overview page shows and EntryPublishFailed carries
    scheduled_publish:
        invalid: '{1} Validation found an error to fix: %errors%|]1,Inf[ Validation found %count% errors to fix: %errors%'
