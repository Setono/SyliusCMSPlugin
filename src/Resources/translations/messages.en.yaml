        deleted_customer_group_negated: 'The customer group "%group%" in a condition of the %block% block was deleted, so the condition no longer excludes anyone through it.'
        deleted_customer_group_in_audience: 'The customer group "%group%" in the audience was deleted, so the audience no longer counts anyone through it.'
        misfit_layout_value: '%field% in the layout holds a value that doesn''t fit its field type, so it counts as empty.'
        misfit_value: '%field% in the %block% block holds a value that doesn''t fit its field type, so it counts as empty.'
        removed_layout: 'Its layout "%layout%" was removed from the code or disabled, so it shows in the default layout, %default%, until you pick one.'
        scheduled_publish_failed: 'The publish scheduled for %at% was stopped: %reason%'
