        customer_group: Customer group
        date_window: Date window
        entry: Entry
        entry_in_category: Entry in category
        locale: Locale
        product: Product
        product_in_taxon: Product in taxon
        taxon: Taxon
    content_type:
        blog_category: Blog category
        blog_post: Blog post
        faq_category: FAQ category
        faq_item: FAQ item
        page: Page
        snippet: Snippet
