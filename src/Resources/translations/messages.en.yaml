            2: '2'
            3: '3'
            4: '4'
        entries_display:
            accordion: Accordion
            carousel: Carousel
            grid: Grid
        heading_level:
            h1: Heading 1
            h2: Heading 2
            h3: Heading 3
            h4: Heading 4
