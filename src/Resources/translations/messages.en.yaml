    slot:
        account:
            dashboard: 'Account dashboard: after the customer''s information'
        cart:
            after_summary: 'Cart: below the summary'
        checkout:
            sidebar: 'Checkout: the sidebar'
        order:
            thank_you: 'Thank-you page: after the message'
        product:
            after_associations: 'Product page: below the associations'
            after_price: 'Product page: under the price'
            before_tabs: 'Product page: above the tabs'
            details_tab: 'Product page: in the details tab, after the description'
            sidebar: 'Product page: the bottom of the column beside the images'
            top: 'Product page: above the main content'
        shop:
            after_content: 'Every page: below the main content'
            before_content: 'Every page: above the main content'
            footer: 'Every page: the footer'
            top: 'Every page: the top of the header'
        store_homepage: 'The store''s own homepage: above its blocks'
        taxon:
            after_grid: 'Taxon page: below the product grid'
