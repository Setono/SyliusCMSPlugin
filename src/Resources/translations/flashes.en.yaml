setono_sylius_cms:
    entry_changes_discarded: The unpublished changes have been discarded.
    entry_deleted: The entry has been deleted.
    entry_draft_locked: The draft is locked until its scheduled publish runs. Cancel the schedule to change it.
    entry_publish_invalid: '{1} It wasn''t published: one error needs fixing.|]1,Inf[ It wasn''t published: %count% errors need fixing.'
