                                internalDescription: "John's photo"
                            custom_asset_lukes_photo:
                                name: 'Luke'
                                path: '@SyliusCoreBundle/Resources/fixtures/adminAvatars/luke.jpg'

                custom_carousels:
                    name: 'setono_sylius_cms_carousel'
                    options:
                        custom:
                            custom_carousel_homepage:
                                code: 'carousel_homepage'
                                internalDescription: 'Homepage carousel'
                                configuration:
                                    infinite: true
                                    slidesToShow: 1
                                    slidesToScroll: 1
                                    autoplay: true
                                    autoplaySpeed: 7000
                                carouselBlocks:
                                    - 'block_carousel_slide_1'
                                    - 'block_carousel_slide_2'

                custom_pages:
                    name: 'setono_sylius_cms_page'
                    options:
                        custom:
