                                slug: 'cms-page-terms'
                                metaDescription: 'Terms and conditions'
                                translations:
                                    de_DE:
                                        title: 'Bedingungen'
                                        slug: 'bedingungen'
                                        metaDescription: 'Geschäftsbedingungen'
                                channels:
                                    - 'FASHION_WEB'
