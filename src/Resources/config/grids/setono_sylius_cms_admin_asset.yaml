sylius_grid:
    grids:
        setono_sylius_cms_admin_asset:
            driver:
                options:
                    class: "%setono_sylius_cms.model.asset.class%"
            limits: [100, 250, 500, 1000]
            fields:
                path:
                    type: string
                    label: sylius.ui.path
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [ path ]
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
