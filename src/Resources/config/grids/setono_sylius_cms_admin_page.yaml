sylius_grid:
    grids:
        setono_sylius_cms_admin_page:
            driver:
                options:
                    class: "%setono_sylius_cms.model.page.class%"
            limits: [100, 250, 500, 1000]
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                view:
                    type: string
                    label: setono_sylius_cms.ui.view
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [ id ] # todo update
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    preview:
                        type: setono_cms_preview_page
