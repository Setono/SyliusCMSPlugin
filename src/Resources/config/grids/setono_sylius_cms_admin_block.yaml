sylius_grid:
    grids:
        setono_sylius_cms_admin_block:
            driver:
                options:
                    class: "%setono_sylius_cms.model.block.class%"
            limits: [100, 250, 500, 1000]
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                internalDescription:
                    type: string
                    label: setono_sylius_cms.ui.internal_description
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [ code, internalDescription ]
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                    duplicate:
                        type: setono_cms_duplicate_block
                        label: setono_sylius_cms.ui.duplicate_block
                        options:
                            link:
                                route: setono_sylius_cms_admin_block_duplicate
                                parameters:
                                    id: resource.id
                bulk:
                    delete:
                        type: delete
