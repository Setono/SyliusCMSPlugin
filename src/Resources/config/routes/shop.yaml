setono_sylius_cms_shop_page_show:
    path: /{slug}
    methods: GET
    defaults:
        _controller: setono_sylius_cms.controller.action.show_page
    # having a condition here makes sure that the order in which (other) routes are added doesn't matter
    # todo look into whether this can be replaced by decorating the UrlMatcher or maybe using an argument value resolver?
    condition: "pageExists(request)"
