# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: en_US

services:
    _defaults:
        autoconfigure: true

    # The test application's own layout for pages, which #[Layout] registers through autoconfiguration
    Setono\SyliusCMSPlugin\Tests\Application\Layout\Landing: ~

    # The test application's own link target, which #[AsLinkTarget] registers through autoconfiguration
    Setono\SyliusCMSPlugin\Tests\Application\Link\StoreLinkTarget: ~
