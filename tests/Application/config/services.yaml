# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: en_US

services:
    _defaults:
        autoconfigure: true

    # The test application's own layout for pages, which #[Layout] registers through autoconfiguration
    Setono\SyliusCMSPlugin\Tests\Application\Layout\Landing: ~

    # The layout of the test application's own store locations
    Setono\SyliusCMSPlugin\Tests\Application\Layout\Store: ~

    # The test application's own link target, which #[AsLinkTarget] registers through autoconfiguration
    Setono\SyliusCMSPlugin\Tests\Application\Link\StoreLinkTarget: ~

    # The test application's own condition kind, with a product parameter, which #[AsConditionKind] registers through
    # autoconfiguration
    Setono\SyliusCMSPlugin\Tests\Application\Condition\ProductAvailableKind: ~

    # The test application's own field type, opening hours: its handler, which autoconfiguration tags, and a block type
    # with a field of it, which #[BlockType] registers. Its field control is public/cms/opening-hours.js
    Setono\SyliusCMSPlugin\Tests\Application\Field\OpeningHoursHandler:
        arguments: ['@translator']
    Setono\SyliusCMSPlugin\Tests\Application\Block\StoreHours: ~

    # The test application's own block type that needs the product of the page it's on, which #[BlockType] registers
    Setono\SyliusCMSPlugin\Tests\Application\Block\ProductNote: ~
