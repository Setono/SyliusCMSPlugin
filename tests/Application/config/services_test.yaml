services:
    # Nothing in the plugin injects the translation state: a project's translator does. The tests get it from the
    # container instead, where an unused private service would be removed
    Setono\SyliusCMSPlugin\Translation\TranslationStateInterface:
        alias: Setono\SyliusCMSPlugin\Translation\TranslationState
        public: true

    # The DSN kept-in-memory:// (.env.test): Sylius's main transport, in memory and kept across the kernel's resets
    Setono\SyliusCMSPlugin\Tests\Support\KeptInMemoryTransportFactory:
        tags: [messenger.transport_factory]
