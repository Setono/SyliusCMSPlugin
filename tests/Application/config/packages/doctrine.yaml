parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        # The driver, server version and charset all come from DATABASE_URL, so the same config runs on MySQL and
        # PostgreSQL. Always include serverVersion in the URL, or Doctrine connects to the database just to detect it
        url: '%env(resolve:DATABASE_URL)%'

        # The legacy schema manager tries to create PostgreSQL's "public" schema, which always exists
        schema_manager_factory: doctrine.dbal.default_schema_manager_factory
