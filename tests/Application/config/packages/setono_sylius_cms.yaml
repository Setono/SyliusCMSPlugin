setono_sylius_cms:
    # A block style added to a shipped block type, as a project adds one
    block_styles:
        group:
            brand: { label: 'app.cms.block_style.brand', class: 'app-group--brand' }

    # Swiss German falls back to German before the store's fallback locale
    fallback_locales:
        de_CH: [de_DE]

    # The field control of the test application's own opening hours field type, a custom element, as an asset path,
    # which asset() resolves. VersionedAssetsKernel gives it a versioned URL
    builder:
        scripts: ['cms/opening-hours.js']

    # The Embed code block, opted in to as a project opts in (ADR 0018). EmbedCodeOffKernel switches it off again
    embed_code: true
